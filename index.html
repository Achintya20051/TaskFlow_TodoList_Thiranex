<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>TaskFlow</h1>
    <p class="subtitle">Organize your day, one task at a time.</p>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="Enter a new task..." maxlength="200" required>
      <button class="add-btn" type="submit">Add Task</button>
    </form>

    <div class="filters" id="filters">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="active">Active</button>
      <button type="button" class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <div class="status">
      <span id="taskCount">0 tasks left</span>
      <button type="button" id="clearCompleted" class="clear-btn">Clear completed</button>
    </div>
  </main>
</body>
</html>
